      if(s){var r=document.documentElement.style;r.setProperty('--accent',s.accent);r.setProperty('--acc-mid',s.mid);r.setProperty('--acc-bg',s.bg);r.setProperty('--accent-r',s.ar);r.setProperty('--accent-g',s.ag);r.setProperty('--accent-b',s.ab);}

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script>
const NAV_H   = 52;
const STRIP_H = 0;

const PHASE_LAYERS = [
  ['spine', 'head'],
  ['ui'],
  ['heart'],
  ['arms', 'pelvis'],
  [],
];

const PHASE_CAPTIONS = [
  'Spine & head — structural core',
  'Instrument UI — the interface',
  'Heart — core mechanism',
  'Arms & pelvis — complete assembly',
  'Fully assembled',
];

let activePhase   = -1;
let svgEl         = null;
let layerAnimated = [];

function animateLayer(groupId, isFirst, customStagger) {
  if (!svgEl) return;
  const group = svgEl.querySelector('#' + groupId);
  if (!group) return;
  const elements = Array.from(group.querySelectorAll('path, circle, line, polyline, ellipse, rect'));
  if (!elements.length) return;
  elements.forEach(el => {
    if (typeof el.getTotalLength === 'function') {
      try {
        const len = el.getTotalLength();
        if (len > 0) { el.style.strokeDasharray = len; el.style.strokeDashoffset = len; }
      } catch(_) {}
    }
    el.style.opacity = '1';
  });
  anime({
    targets:          elements,
    strokeDashoffset: [anime.setDashoffset, 0],
    opacity:          1,
    easing:           'easeInOutSine',
    duration:         isFirst ? 900 : 700,
    delay:            anime.stagger(customStagger !== undefined ? customStagger : (isFirst ? 18 : 12)),
  });
}

function animateRibsOnLoad() {
  if (!svgEl) return;
  const group = svgEl.querySelector('#ribs');
  if (!group) return;
  const children = Array.from(group.children).filter(c =>
    c.tagName === 'g' || c.tagName === 'path' || c.tagName === 'polyline' || c.tagName === 'ellipse'
  );
  const targets = children.length > 1 ? children
    : Array.from(group.querySelectorAll('path, circle, line, polyline, ellipse, rect'));
  targets.forEach(el => {
    const paths = el.querySelectorAll ? Array.from(el.querySelectorAll('path, polyline, ellipse, circle, line')) : [el];
    const allEls = paths.length ? paths : [el];
    allEls.forEach(p => {
      if (typeof p.getTotalLength === 'function') {
        try {
          const len = p.getTotalLength();
          if (len > 0) { p.style.strokeDasharray = len; p.style.strokeDashoffset = len; }
        } catch(_) {}
      }
      p.style.opacity = '1';
    });
  });
  anime({
    targets:          targets,
    opacity:          1,
    strokeDashoffset: [anime.setDashoffset, 0],
    easing:           'easeInOutQuart',
    duration:         600,
    delay:            anime.stagger(140, { start: 200 }),
  });
  layerAnimated.push('ribs');
}

function dimLayer(groupId) {
  if (!svgEl) return;
  const group = svgEl.querySelector('#' + groupId);
  if (!group) return;
  anime({
    targets:  Array.from(group.querySelectorAll('path, circle, line, polyline, ellipse, rect')),
    opacity:  0.18,
    easing:   'easeOutSine',
    duration: 600,
  });
}

function restoreLayer(groupId) {
  if (!svgEl) return;
  const group = svgEl.querySelector('#' + groupId);
  if (!group) return;
  anime({
    targets:  Array.from(group.querySelectorAll('path, circle, line, polyline, ellipse, rect')),
    opacity:  1,
    easing:   'easeOutSine',
    duration: 400,
  });
}

function setPhase(idx) {
  if (idx === activePhase) return;
  const prev = activePhase;
  activePhase = idx;

  document.getElementById('skelLayerLabel').textContent = PHASE_CAPTIONS[idx] || '—';
  document.getElementById('skelCaption').dataset.phase = idx;

  const layers = PHASE_LAYERS[idx];
  if (layers) {
    layers.forEach((lid, i) => {
      if (!layerAnimated.includes(lid)) {
        layerAnimated.push(lid);
        setTimeout(() => animateLayer(lid, i === 0), i * 120);
      } else {
        restoreLayer(lid);
      }
    });
  }

  if (prev > idx) {
    for (let p = idx + 1; p <= 4; p++) {
      (PHASE_LAYERS[p] || []).forEach(lid => {
        if (layerAnimated.includes(lid)) dimLayer(lid);
      });
    }
    (PHASE_LAYERS[idx] || []).forEach(lid => restoreLayer(lid));
  }
}

fetch('images/skeleton.svg')
  .then(r => r.text())
  .then(txt => {
    const parser = new DOMParser();
    const doc    = parser.parseFromString(txt, 'image/svg+xml');
    svgEl        = doc.querySelector('svg');
    svgEl.setAttribute('width',  '100%');
    svgEl.setAttribute('height', '100%');
    svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svgEl.style.display = 'block';
    svgEl.querySelectorAll('path, circle, line, polyline, ellipse, rect').forEach(el => {
      el.style.opacity = '0.07';
    });
    document.getElementById('skelContainer').appendChild(svgEl);
    setTimeout(animateRibsOnLoad, 400);
    initScrollTracking();
  });

function initScrollTracking() {
  const topOffset = NAV_H + STRIP_H;
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const p = parseInt(e.target.dataset.phase);
        if (!isNaN(p)) setPhase(p);
      }
    });
  }, {
    rootMargin: `-${topOffset}px 0px -40% 0px`,
    threshold:  0,
  });
  document.querySelectorAll('.prog-phase').forEach(s => io.observe(s));
  setPhase(0);
}
</script>
